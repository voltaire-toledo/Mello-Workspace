<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QuickNote MD</title>
<script src="marked.min.js"></script>
<style>
  :root {
    --bg: rgba(243, 243, 243, 0.50); --fg: #1a2023; --pane-bg: rgba(255, 255, 255, 0.45); --border: rgba(216, 220, 222, 0.50);
    --status-bg: rgba(231, 233, 234, 0.55); --status-fg: #4a5157; --code-bg: rgba(238, 240, 241, 0.70); --link: #2662d9;
    --notice: #a15c00;
  }
  body.dark {
    --bg: rgba(35, 42, 47, 0.55); --fg: #f3f3f3; --pane-bg: rgba(27, 33, 38, 0.50); --border: rgba(56, 64, 73, 0.50);
    --status-bg: rgba(27, 33, 38, 0.60); --status-fg: #a9b1b8; --code-bg: rgba(42, 50, 56, 0.70); --link: #6fa8ff;
    --notice: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; overflow: hidden;
  }
  #stage { flex: 1; position: relative; min-height: 0; }
  #editor, #preview { position: absolute; inset: 0; }
  #editor {
    resize: none; border: none; outline: none; width: 100%; height: 100%;
    padding: 18px 20px; background: var(--pane-bg); color: var(--fg);
    font: 13px/1.5 Consolas, "Cascadia Code", monospace; white-space: pre-wrap;
  }
  #preview { overflow-y: auto; padding: 18px 24px; background: var(--bg); }
  #preview img {
    display: block;
    max-width: 80%;
    height: auto;
    margin: 14px auto;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  #preview pre { background: var(--code-bg); padding: 8px 10px; overflow-x: auto; border-radius: 4px; line-height: 1.2; }
  #preview code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
  #preview pre code { background: none; padding: 0; }
  #preview a { color: var(--link); }
  #preview blockquote { margin: 0 0 0 4px; padding-left: 10px; border-left: 3px solid var(--border); color: var(--status-fg); }
  #preview blockquote.callout {
    margin: 14px 0;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-sizing: border-box;
    width: 100%;
    color: var(--fg);
  }
  #preview blockquote.callout .callout-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.95em;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  #preview blockquote.callout p { margin: 0.4em 0; }
  #preview blockquote.callout p:first-of-type { margin-top: 0; }
  #preview blockquote.callout p:last-of-type { margin-bottom: 0; }

  /* Note (Blue) */
  #preview blockquote.callout-note {
    border: 1px solid #2563eb;
    background-color: rgba(37, 99, 235, 0.10);
  }
  #preview blockquote.callout-note .callout-header { color: #1d4ed8; }
  body.dark #preview blockquote.callout-note {
    border-color: #3b82f6;
    background-color: rgba(37, 99, 235, 0.22);
  }
  body.dark #preview blockquote.callout-note .callout-header { color: #60a5fa; }

  /* Tip (Green) */
  #preview blockquote.callout-tip {
    border: 1px solid #16a34a;
    background-color: rgba(22, 163, 74, 0.10);
  }
  #preview blockquote.callout-tip .callout-header { color: #15803d; }
  body.dark #preview blockquote.callout-tip {
    border-color: #22c55e;
    background-color: rgba(22, 163, 74, 0.22);
  }
  body.dark #preview blockquote.callout-tip .callout-header { color: #4ade80; }

  /* Important (Purple) */
  #preview blockquote.callout-important {
    border: 1px solid #9333ea;
    background-color: rgba(147, 51, 234, 0.10);
  }
  #preview blockquote.callout-important .callout-header { color: #7e22ce; }
  body.dark #preview blockquote.callout-important {
    border-color: #a855f7;
    background-color: rgba(147, 51, 234, 0.22);
  }
  body.dark #preview blockquote.callout-important .callout-header { color: #c084fc; }

  /* Warning (Orange) */
  #preview blockquote.callout-warning {
    border: 1px solid #ea580c;
    background-color: rgba(234, 88, 12, 0.10);
  }
  #preview blockquote.callout-warning .callout-header { color: #c2410c; }
  body.dark #preview blockquote.callout-warning {
    border-color: #f97316;
    background-color: rgba(234, 88, 12, 0.22);
  }
  body.dark #preview blockquote.callout-warning .callout-header { color: #fb923c; }

  /* Caution (Red) */
  #preview blockquote.callout-caution {
    border: 1px solid #dc2626;
    background-color: rgba(220, 38, 38, 0.10);
  }
  #preview blockquote.callout-caution .callout-header { color: #b91c1c; }
  body.dark #preview blockquote.callout-caution {
    border-color: #ef4444;
    background-color: rgba(220, 38, 38, 0.22);
  }
  body.dark #preview blockquote.callout-caution .callout-header { color: #f87171; }

  /* Keyboard shortcut styling */
  #preview kbd {
    display: inline-block; padding: 2px 6px; font: 11px/1.4 Consolas, "Segoe UI", monospace;
    color: var(--fg); background-color: var(--pane-bg); border: 1px solid var(--border);
    border-radius: 4px; box-shadow: 0 1px 0 var(--border), 0 0 0 1px #fff inset; vertical-align: baseline;
  }
  body.dark #preview kbd { box-shadow: 0 1px 0 var(--border), 0 0 0 1px #2a3238 inset; }

  /* Status & Category Badges */
  #preview .badge {
    display: inline-flex; align-items: center; padding: 2px 8px; font-size: 11px;
    font-weight: 600; border-radius: 12px; margin: 0 3px; vertical-align: baseline;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  #preview .badge-feature { background: rgba(16, 185, 129, 0.15); color: #059669; border: 1px solid rgba(16, 185, 129, 0.35); }
  #preview .badge-enhancement { background: rgba(99, 102, 241, 0.15); color: #4f46e5; border: 1px solid rgba(99, 102, 241, 0.35); }
  #preview .badge-task { background: rgba(100, 116, 139, 0.15); color: #475569; border: 1px solid rgba(100, 116, 139, 0.35); }
  #preview .badge-bug { background: rgba(239, 68, 68, 0.15); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.35); }
  #preview .badge-fix { background: rgba(234, 179, 8, 0.15); color: #a16207; border: 1px solid rgba(234, 179, 8, 0.4); }
  #preview .badge-p1 { background: rgba(220, 38, 38, 0.18); color: #b91c1c; border: 1px solid rgba(220, 38, 38, 0.45); font-weight: 700; }
  #preview .badge-p2 { background: rgba(234, 88, 12, 0.18); color: #c2410c; border: 1px solid rgba(234, 88, 12, 0.4); }
  #preview .badge-p3 { background: rgba(59, 130, 246, 0.15); color: #1d4ed8; border: 1px solid rgba(59, 130, 246, 0.35); }
  #preview .badge-lookup { background: rgba(14, 165, 233, 0.15); color: #0284c7; border: 1px solid rgba(14, 165, 233, 0.35); }

  body.dark #preview .badge-feature { color: #34d399; }
  body.dark #preview .badge-enhancement { color: #818cf8; }
  body.dark #preview .badge-task { color: #94a3b8; }
  body.dark #preview .badge-bug { color: #f87171; }
  body.dark #preview .badge-fix { color: #facc15; background: rgba(234, 179, 8, 0.25); border-color: rgba(250, 204, 21, 0.5); }
  body.dark #preview .badge-p1 { color: #f87171; background: rgba(220, 38, 38, 0.25); border-color: rgba(248, 113, 113, 0.5); }
  body.dark #preview .badge-p2 { color: #fb923c; background: rgba(234, 88, 12, 0.25); border-color: rgba(251, 146, 60, 0.5); }
  body.dark #preview .badge-p3 { color: #60a5fa; background: rgba(59, 130, 246, 0.25); border-color: rgba(96, 165, 250, 0.5); }
  body.dark #preview .badge-lookup { color: #38bdf8; }

  #preview table { border-collapse: collapse; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 3px 8px; }
  #preview h1 { font-size: 1.5em; margin: 0.8em 0 0.4em; }
  #preview h2 { font-size: 1.35em; margin: 1.4em 0 0.4em; padding-top: 6px; }
  #preview h3 { font-size: 1.2em; margin: 1.2em 0 0.3em; padding-top: 4px; }
  #preview h4 { font-size: 1.10em; margin: 1.0em 0 0.3em; }
  #preview hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
    opacity: 0.6;
  }
  #preview ul, #preview ol { padding-left: 24px; margin: 8px 0; }
  #preview ul ul, #preview ol ol, #preview ul ol, #preview ol ul {
    margin: 4px 0;
    padding-left: 20px;
  }
  #preview li { margin: 4px 0; line-height: 1.5; }
  #preview li:has(> input[type="checkbox"]),
  #preview li:has(input[type="checkbox"]),
  #preview li.task-list-item {
    list-style-type: none;
    margin-left: 0;
    padding-left: 0;
  }
  #preview input[type="checkbox"] {
    margin: 0 6px 0 0;
    vertical-align: middle;
    accent-color: var(--link);
  }
  body.mode-edit #preview { display: none; }
  body.mode-view #editor { display: none; }
  #statusbar {
    flex: 0 0 auto; display: flex; justify-content: space-between; gap: 12px;
    padding: 3px 10px; background: var(--status-bg); color: var(--status-fg);
    font: 11px/1.4 "Segoe UI", sans-serif; border-top: 1px solid var(--border);
    white-space: nowrap;
  }
  #statusbar .hint { overflow: hidden; text-overflow: ellipsis; }
  #statusbar .hint.notice { color: var(--notice); font-weight: 600; }
  #statusbar .counts { flex: 0 0 auto; }
</style>
</head>
<body class="light mode-edit">
  <div id="stage">
    <textarea id="editor" spellcheck="false" wrap="off"
      placeholder="Start typing Markdown... paste an image with Ctrl+V"></textarea>
    <div id="preview" tabindex="-1"></div>
  </div>
  <div id="statusbar">
    <span class="hint" id="hint"></span>
    <span class="counts" id="counts">0 words, 0 chars</span>
  </div>

<script>
(function () {
  marked.use({
    renderer: {
      // Allow intentional line break tags and allowed inline tags (kbd, badge span, callout strong)
      html(token) {
        const raw = typeof token === 'string' ? token : (token && token.raw ? token.raw : '');
        const trimmed = raw.trim();
        if (/^<br\s*\/?>$/i.test(trimmed)) {
          return '<br>';
        }
        if (/^<\/?(?:kbd|span|strong)(?:\s[^>]*)?>$/i.test(trimmed)) {
          return raw;
        }
        return '';
      }
    }
  });
  marked.setOptions({ gfm: true, breaks: true });

  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const counts = document.getElementById('counts');
  const hint = document.getElementById('hint');
  let saveTimer = null, suppressSave = false;
  let mode = 'edit';
  let noticeTimer = null;
  let transparencyPct = 100;

  function processExtensions(src) {
    if (!src) return '';
    // 1. Badge tags: [[FEATURE]], [[ENHANCEMENT]], [[TASK]], [[BUG]], [[FIX]], [[P1]], [[P2]], [[P3]], [[LOOKUP]]
    //    Also supports single-bracket versions [FEATURE], [P1], etc.
    function renderBadge(name) {
      const upper = name.toUpperCase();
      const lower = name.toLowerCase();
      let label = upper;
      if (upper === 'P1') label = '🔥 ' + upper;
      else if (upper === 'P2') label = '🔥🔥 ' + upper;
      else if (upper === 'P3') label = '🔥🔥🔥 ' + upper;
      return '<span class="badge badge-' + lower + '">' + label + '</span>';
    }
    let out = src.replace(/\[\[(FEATURE|ENHANCEMENT|TASK|BUG|FIX|P1|P2|P3|LOOKUP)\]\]/gi, (m, p1) => renderBadge(p1));
    out = out.replace(/\[(?:🪶\s*|)(FEATURE)\]/gi, () => renderBadge('FEATURE'));
    out = out.replace(/\[(?:🎁\s*|)(ENHANCEMENT)\]/gi, () => renderBadge('ENHANCEMENT'));
    out = out.replace(/\[(?:🐞\s*|)(BUG)\]/gi, () => renderBadge('BUG'));
    out = out.replace(/\[(TASK|FIX|P1|P2|P3)\]/gi, (m, p1) => renderBadge(p1));
    out = out.replace(/\[(?:👁️\s*|👁\s*|)(LOOKUP)\]/gi, () => renderBadge('LOOKUP'));

    // 2. [[Key]] -> <kbd>Key</kbd>
    out = out.replace(/\[\[([a-zA-Z0-9_+\- /\\.?]+)\]\]/g, (m, p1) => '<kbd>' + p1 + '</kbd>');

    // 3. Admonitions: > [!NOTE], > [!TIP], > [!IMPORTANT], > [!WARNING], > [!CAUTION]
    const icons = {
      note: 'ℹ️',
      tip: '💡',
      important: '📌',
      warning: '⚠️',
      caution: '🛑'
    };
    out = out.replace(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/gim, (m, type, rest) => {
      const t = type.toLowerCase();
      const icon = icons[t] || 'ℹ️';
      const label = type.toUpperCase();
      return `> <strong class="callout-header">${icon} ${label}</strong>${rest ? '<br>' + rest : ''}`;
    });

    return out;
  }

  function render() {
    const rawMarkdown = processExtensions(editor.value);
    preview.innerHTML = marked.parse(rawMarkdown);

    // Apply callout container classes to blockquotes containing callout headers
    preview.querySelectorAll('blockquote').forEach((bq) => {
      const header = bq.querySelector('.callout-header');
      if (header) {
        bq.classList.add('callout');
        const text = header.textContent.toLowerCase();
        if (text.includes('note')) bq.classList.add('callout-note');
        else if (text.includes('tip')) bq.classList.add('callout-tip');
        else if (text.includes('important')) bq.classList.add('callout-important');
        else if (text.includes('warning')) bq.classList.add('callout-warning');
        else if (text.includes('caution')) bq.classList.add('callout-caution');
      }
    });

    // Enable interactive checkboxes in preview mode
    const checkboxes = preview.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach((cb, index) => {
      cb.removeAttribute('disabled');
      cb.dataset.index = index;
    });

    const text = editor.value, trimmed = text.trim();
    const words = trimmed === '' ? 0 : trimmed.replace(/\s+/g, ' ').split(' ').length;
    counts.textContent = words + ' words, ' + text.length + ' chars, ' + transparencyPct + '% tr';
  }

  // Handle interactive checkbox toggling in preview mode
  preview.addEventListener('change', (e) => {
    if (e.target && e.target.type === 'checkbox') {
      const targetIndex = parseInt(e.target.dataset.index, 10);
      let count = 0;
      editor.value = editor.value.replace(/^(\s*[-*]\s+\[)([ xX])(\]\s+)/gm, (match, prefix, state, suffix) => {
        if (count === targetIndex) {
          const nextState = e.target.checked ? 'x' : ' ';
          count++;
          return prefix + nextState + suffix;
        }
        count++;
        return match;
      });
      render();
      scheduleSave();
    }
  });

  function updateHint() {
    hint.classList.remove('notice');
    hint.textContent = 'Alt+V to toggle Edit/Preview Mode \u2022 Ctrl + Scroll to zoom \u2022 Alt + Scroll to adjust transparency';
  }

  function flashReadonlyNotice() {
    hint.textContent = 'Read-only in Preview mode \u2014 press Alt+V to toggle Edit mode';
    hint.classList.add('notice');
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(updateHint, 1500);
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    document.body.classList.toggle('mode-edit', mode === 'edit');
    document.body.classList.toggle('mode-view', mode === 'view');
    if (mode === 'view') {
      render();
      preview.focus();
    } else {
      editor.focus();
      const len = editor.value.length;
      editor.setSelectionRange(len, len);
    }
    updateHint();
  }

  function toggleMode() {
    setMode(mode === 'edit' ? 'view' : 'edit');
  }

  function scheduleSave() {
    if (suppressSave) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(editor.value);
      }
    }, 600);
  }

  function insertAtCursor(text) {
    const start = editor.selectionStart, end = editor.selectionEnd;
    editor.setRangeText(text, start, end, 'end');
    editor.dispatchEvent(new Event('input'));
  }

  function wrapSelection(pre, post) {
    const start = editor.selectionStart, end = editor.selectionEnd;
    const sel = editor.value.slice(start, end);
    editor.setRangeText(pre + sel + post, start, end, sel === '' ? 'end' : 'select');
    if (sel === '') editor.setSelectionRange(start + pre.length, start + pre.length);
    editor.dispatchEvent(new Event('input'));
  }

  editor.addEventListener('input', () => { render(); scheduleSave(); });

  editor.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) continue;
        const reader = new FileReader();
        reader.onload = () => insertAtCursor('![](' + reader.result + ')');
        reader.readAsDataURL(file);
        return;
      }
    }
    // Non-image paste: allow the browser's default plain-text paste.
  });

  // Edit-mode-only shortcuts. These only ever see events while the editor is
  // focused, which only happens in edit mode (it's hidden/unfocused in view mode).
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      insertAtCursor('  ');
      return;
    }
    if (e.key === 'Enter') {
      // Continue an active list marker onto the next line.
      const start = editor.selectionStart;
      const lineStart = editor.value.lastIndexOf('\n', start - 1) + 1;
      const line = editor.value.slice(lineStart, start);
      const m = line.match(/^(\s*(?:[-*]|\d+\.)\s+)/);
      if (m && m[1].trim() !== line.trim()) {
        e.preventDefault();
        insertAtCursor('\n' + m[1]);
      }
      return;
    }
    if (e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'b') {
      e.preventDefault(); wrapSelection('**', '**'); return;
    }
    if (e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'i') {
      e.preventDefault(); wrapSelection('*', '*'); return;
    }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
      e.preventDefault(); wrapSelection('`', '`'); return;
    }
  });

  // Global: Escape toggles Edit/View. In View mode, any key that would try to
  // modify content is blocked and reported via the status bar instead of
  // silently doing nothing (there's no split pane anymore, so this is the
  // only signal the user gets that they're in a read-only mode).
  const VIEW_SCROLL_KEYS = new Set([
    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'
  ]);
  document.addEventListener('keydown', (e) => {
    if (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'v') {
      e.preventDefault();
      toggleMode();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage('__QNMD_HIDE__');
      }
      return;
    }
    if (mode !== 'view') return;
    if (VIEW_SCROLL_KEYS.has(e.key)) return;
    if (e.ctrlKey && e.key.toLowerCase() === 'c') return; // allow copy
    e.preventDefault();
    flashReadonlyNotice();
  });

  // Bridge exposed for the AHK host to call via ExecuteScriptAsync.
  window.QN = {
    loadNote(text) {
      suppressSave = true;
      editor.value = text;
      render();
      suppressSave = false;
    },
    setTheme(dark) {
      document.body.classList.toggle('dark', !!dark);
      document.body.classList.toggle('light', !dark);
    },
    setTransparency(pct) {
      transparencyPct = pct;
      render();
    },
    focus() {
      if (mode === 'edit') {
        editor.focus();
        const len = editor.value.length;
        editor.setSelectionRange(len, len);
      } else {
        preview.focus();
      }
    }
  };

  render();
  updateHint();
})();
</script>
</body>
</html>
