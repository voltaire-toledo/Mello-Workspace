<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="Segoe UI, -apple-system, sans-serif">
  <rect width="1180" height="660" fill="#e9e9e9"/>

  <!-- ===== Labels ===== -->
  <text x="290" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2023">Edit mode</text>
  <text x="890" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2023">View mode (read-only)</text>

  <!-- ===== Esc toggle indicator ===== -->
  <g transform="translate(580,330)">
    <circle r="34" fill="#ffffff" stroke="#d8dcde" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-size="12" font-weight="700" fill="#4a5157">Esc</text>
    <text x="0" y="13" text-anchor="middle" font-size="14" fill="#4a5157">&#8644;</text>
  </g>

  <!-- ===================== EDIT MODE WINDOW ===================== -->
  <g transform="translate(20,44)">
    <rect width="540" height="580" fill="#ffffff" stroke="#b9bec2" stroke-width="1"/>
    <!-- editor text (monospace, raw markdown source) -->
    <g font-family="Consolas, 'Cascadia Code', monospace" font-size="13" fill="#1a2023">
      <text x="12" y="28" font-weight="700"># Sprint Notes</text>
      <text x="12" y="47">Ping </text>
      <text x="48" y="47" font-weight="700">**Sam**</text>
      <text x="98" y="47"> about the </text>
      <text x="170" y="47" text-decoration="line-through">~~old~~</text>
      <text x="222" y="47"> new API contract</text>
      <text x="12" y="65">before Thursday's sync.</text>
      <text x="12" y="102">- [ ] Review PR #482</text>
      <text x="12" y="120">- [ ] Update onboarding doc</text>
      <text x="12" y="138">- [x] Ship QuickNote MD Edit/View modes</text>
      <text x="12" y="175">```powershell</text>
      <text x="12" y="193">git log --oneline -5</text>
      <text x="12" y="211">```</text>
      <!-- blinking cursor -->
      <rect x="12" y="217" width="7" height="15" fill="#1a2023"/>
    </g>
    <!-- status bar -->
    <rect x="0" y="556" width="540" height="24" fill="#e7e9ea" stroke="#d8dcde" stroke-width="1"/>
    <text x="10" y="572" font-size="11" fill="#4a5157">Esc: switch to View  &#183;  Ctrl+B/I bold/italic  &#183;  Ctrl+V paste image</text>
    <text x="530" y="572" text-anchor="end" font-size="11" fill="#4a5157">33 words, 210 chars</text>
  </g>

  <!-- ===================== VIEW MODE WINDOW ===================== -->
  <g transform="translate(620,44)">
    <rect width="540" height="580" fill="#f3f3f3" stroke="#b9bec2" stroke-width="1"/>
    <g fill="#1a2023">
      <text x="16" y="38" font-size="26" font-weight="700">Sprint Notes</text>
      <text x="16" y="66" font-size="13">
        <tspan>Ping </tspan><tspan font-weight="700">Sam</tspan><tspan> about the </tspan><tspan text-decoration="line-through">old</tspan><tspan> new API contract</tspan>
      </text>
      <text x="16" y="84" font-size="13">before Thursday's sync.</text>

      <!-- task list -->
      <rect x="17" y="104" width="11" height="11" fill="none" stroke="#4a5157"/>
      <text x="36" y="113" font-size="13">Review PR #482</text>
      <rect x="17" y="124" width="11" height="11" fill="none" stroke="#4a5157"/>
      <text x="36" y="133" font-size="13">Update onboarding doc</text>
      <rect x="17" y="144" width="11" height="11" fill="#1a2023" stroke="#4a5157"/>
      <text x="21" y="153" font-size="10" fill="#ffffff">&#10003;</text>
      <text x="36" y="153" font-size="13">Ship QuickNote MD Edit/View modes</text>

      <!-- code block: plain, no syntax highlighting -->
      <rect x="16" y="174" width="300" height="34" fill="#eef0f1" rx="4"/>
      <text x="26" y="195" font-family="Consolas, 'Cascadia Code', monospace" font-size="12" fill="#1a2023">git log --oneline -5</text>
    </g>
    <!-- status bar -->
    <rect x="0" y="556" width="540" height="24" fill="#e7e9ea" stroke="#d8dcde" stroke-width="1"/>
    <text x="10" y="572" font-size="11" fill="#4a5157">Esc: switch to Edit  &#183;  read-only in View mode</text>
    <text x="530" y="572" text-anchor="end" font-size="11" fill="#4a5157">33 words, 210 chars</text>
  </g>
</svg>
